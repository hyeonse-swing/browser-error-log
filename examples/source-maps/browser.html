<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Source map fixture</title>
<button id="fire" type="button">Trigger fixture error</button>
<script type="module">
  import { init } from '/sdk.js';

  const release = new URLSearchParams(location.search).get('release') || 'unknown';
  window.__sourceMapFixtureClient = init({
    project: 'source-map-example',
    environment: 'local',
    release,
    endpoint: '/api/events',
    captureNetwork: false,
    flushIntervalMs: 50,
  });

  const bundle = document.createElement('script');
  bundle.src = '/assets/app.js?token=private-fixture#private-fragment';
  document.body.append(bundle);
</script>
</html>
