name: Deploy archive viewer

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'examples/source-maps/**'
      - 'scripts/prepare-source-map.mjs'
      - 'vite.config.ts'
      - 'package*.json'
      - '.nvmrc'
      - '.github/workflows/viewer-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viewer-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'hyeonse-swing/browser-error-log' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck && npm test
      - run: npm run build:sdk
      - run: npx --no-install vite build --mode archive --base /browser-error-log/
      - name: Include synthetic two-release example
        run: |
          node examples/source-maps/build-fixture.mjs --output-dir "$RUNNER_TEMP/source-map-example"
          cd "$RUNNER_TEMP/source-map-example"
          zip "$GITHUB_WORKSPACE/dist/viewer-static/source-map-example.zip" events.json A/manifest.json A/assets/app.js.map B/manifest.json B/assets/app.js.map
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/viewer-static
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish viewer
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
