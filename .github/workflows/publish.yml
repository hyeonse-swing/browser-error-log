name: Publish npm release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'hyeonse-swing/browser-error-log' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.0 --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify tagged source and publish exact tarballs
        run: |
          node --test scripts/release.test.mjs
          npm run check
          npm run check:package
          npm run check:micro
          node scripts/release-publish.mjs
  catchup:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Recheck main after verified npm publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/prepare.yml/dispatches" \
            -f ref=main -f "inputs[verified_release_tag]=$GITHUB_REF_NAME" \
            -f "inputs[publish_run_id]=$GITHUB_RUN_ID" \
            -f "inputs[publish_run_attempt]=$GITHUB_RUN_ATTEMPT"
