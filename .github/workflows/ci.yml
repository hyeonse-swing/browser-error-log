name: Verify changes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install npm
        run: npm install --global npm@11.21.0 --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify release logic, types, tests and build
        run: |
          node --test scripts/release.test.mjs
          npm run check
      - name: Verify packaged consumers and collector
        run: |
          npm run check:package
          npm run check:micro
      - name: Install test browsers
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Verify browser delivery
        run: npm run check:browser
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-failure-evidence
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7
