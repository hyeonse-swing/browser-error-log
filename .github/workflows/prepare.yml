name: Prepare npm release

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Publish npm release]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: npm-release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'hyeonse-swing/browser-error-log' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.0 --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare or resume release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-prepare.mjs
