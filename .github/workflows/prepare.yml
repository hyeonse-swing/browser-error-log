name: Prepare npm release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_bump:
        description: Version bump for a manual release (automatic main pushes always use patch)
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      verified_release_tag:
        description: Tag whose npm packages passed the publisher's registry and consumer checks
        required: false
        type: string
      publish_run_id:
        description: Publisher workflow run ID for this tag
        required: false
        type: string
      publish_run_attempt:
        description: Publisher workflow run attempt for this tag
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: npm-release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'hyeonse-swing/browser-error-log' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.0 --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare or resume release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-prepare.mjs
